# 只从上游源码库拉取，编译单个包产出 ipk/ko。
# 不使用 fork 自定义 feed、QModem、拨号包或设备 .config 里的应用包。
name: Build IPK (upstream only)

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'Upstream OpenWrt source repo'
        required: true
        default: 'https://github.com/immortalwrt/immortalwrt'
      repo_branch:
        description: 'Upstream source branch'
        required: true
        default: 'openwrt-25.12'
      target:
        description: 'Upstream Kwrt device config (devices/<target>/.config)'
        required: true
        default: 'rockchip_armv8'
      package:
        description: 'Package path under openwrt/ to compile'
        required: true
        default: 'package/kernel/aic8800'
      kernel_version:
        description: 'Kernel version, MUST equal target device uname -r'
        required: true
        default: '6.12.115'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout clean upstream Kwrt (docs/ web site untouched)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -hT

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev libelf-dev python3 python3-dev \
            python3-distutils python3-setuptools python3-pyelftools rsync unzip zlib1g-dev file wget \
            libtool libtool-bin cmake swig ecj fastjar java-propose-classpath zstd xz-utils
          # target/linux/prereq 的 u-boot 检查直接 import elftools；apt 包与 pip 双保险。
          python3 -c 'import elftools' 2>/dev/null || sudo pip3 install pyelftools

      - name: Pull upstream source repo only
        run: |
          git clone --depth 1 -b "${{ github.event.inputs.repo_branch }}" "${{ github.event.inputs.repo_url }}" openwrt
          cd openwrt
          git log -1 --oneline
          test -d "${{ github.event.inputs.package }}" || { echo "上游源码缺少 ${{ github.event.inputs.package }}"; exit 1; }

      - name: Align kernel version + minimal config
        run: |
          set -e
          cd openwrt
          KV="${{ github.event.inputs.kernel_version }}"
          KPATCH=".${KV##*.}"
          echo "目标内核 = $KV，上游默认内核定义："
          cat target/linux/generic/kernel-6.12

          # 上游写死 6.12.112，M28C 是 6.12.115；不 pin 的话 ko 的 vermagic 装不上设备。
          # 从 kernel.org 官方 sha256sums.asc 取对应 tarball 的 hash，替换掉源码里的版本定义。
          curl -fsSL --retry 3 --max-time 90 \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/sha256sums.asc -o /tmp/kernel-sha256sums.asc
          KHASH=$(awk -v v="linux-${KV}.tar.xz" '$2==v{print $1}' /tmp/kernel-sha256sums.asc)
          test -n "$KHASH" || { echo "kernel.org 没有 ${KV} 的 hash"; exit 1; }
          sed -i -E "s|^LINUX_VERSION-6\.12 = \.[0-9]+$|LINUX_VERSION-6.12 = ${KPATCH}|" target/linux/generic/kernel-6.12
          sed -i -E '/^LINUX_KERNEL_HASH-6\.12\./d' target/linux/generic/kernel-6.12
          echo "LINUX_KERNEL_HASH-${KV} = ${KHASH}" >> target/linux/generic/kernel-6.12
          echo "--- 对齐后 ---"
          cat target/linux/generic/kernel-6.12

          # 上游 devices/<target>/.config 只有 target 定义；defconfig 会展开出 180+ 个默认包。
          # package/<x>/compile 会遍历 package-y + package-m，任一无关包（gpio-button-hotplug、
          # linux-firmware 等）失败就全盘 Error 2，所以除目标包外全部显式置 n。
          cp "../devices/${{ github.event.inputs.target }}/.config" .config
          make defconfig
          sed -i -E 's/^CONFIG_PACKAGE_([^=]+)=[ym]$/# CONFIG_PACKAGE_\1 is not set/' .config
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_kmod-aic8800-sdio=m
          CONFIG_PACKAGE_aic8800-sdio-firmware=m
          CONFIG_PACKAGE_kmod-cfg80211=m
          CONFIG_PACKAGE_kmod-mac80211=m
          EOF
          make defconfig
          echo "--- 实际选中的包 ---"
          grep -E '^CONFIG_PACKAGE_.*=[ym]' .config || true

          # pin 到 6.12.115 后上游补丁集有两处硬冲突:
          #   backport-6.12/732-v6.18-wifi-mt76-wed... 在 mtk_wed.h Hunk #1 FAILED;
          #   pending-6.12/720-01-net-phy-realtek... "can't find file to patch";
          # 两者都让 toolchain/kernel-headers/.prepared Error 1。
          # 但绝不能删光全部 .patch: hack-6.12 给 net_device 补了
          # ieee80211_ptr / netns_local, backports-6.18.55 的 cfg80211 依赖这两个字段,
          # 删掉后 mac80211 编译报 "'struct net_device' has no member named ..."。
          KV="${{ github.event.inputs.kernel_version }}"
          PRUNED=0
          for p in target/linux/generic/backport-6.12/*.patch; do
            [ -f "$p" ] || continue
            n=$(basename "$p" | cut -d- -f1)
            case "$n" in ''|*[!0-9]*) continue ;; esac
            if [ "$n" -ge 732 ]; then
              echo "prune backport $p"; rm -f "$p"; PRUNED=$((PRUNED+1))
            fi
          done
          for p in target/linux/generic/pending-6.12/*.patch; do
            [ -f "$p" ] || continue
            echo "prune pending $p"; rm -f "$p"; PRUNED=$((PRUNED+1))
          done

          # 剩余补丁在干净的 6.12.115 内核树上按 OpenWrt 的顺序逐个试应用,
          # 不能应用的自动剔除, 避免 target/linux/compile 阶段再炸一次。
          PROBE=/tmp/kprobe
          rm -rf "$PROBE" /tmp/kprobe.tar.xz
          mkdir -p "$PROBE"
          curl -fsSL --retry 3 --max-time 300 \
            "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KV}.tar.xz" -o /tmp/kprobe.tar.xz
          tar -xf /tmp/kprobe.tar.xz -C "$PROBE" --strip-components=1
          for d in target/linux/generic/files-6.12 target/linux/rockchip/files-6.12; do
            if [ -d "$d" ]; then cp -a "$d/." "$PROBE/"; fi
          done
          for d in target/linux/generic/hack-6.12 target/linux/generic/backport-6.12 \
                   target/linux/generic/pending-6.12 target/linux/rockchip/patches-6.12; do
            [ -d "$d" ] || continue
            for p in "$d"/*.patch; do
              [ -f "$p" ] || continue
              A="$(pwd)/$p"
              if ( cd "$PROBE" && patch -p1 --batch --forward --no-backup-if-mismatch --dry-run --silent < "$A" >/dev/null 2>&1 ); then
                if ! ( cd "$PROBE" && patch -p1 --batch --forward --no-backup-if-mismatch --silent < "$A" >/dev/null 2>&1 ); then
                  echo "prune apply $p"; rm -f "$p"; PRUNED=$((PRUNED+1))
                fi
              else
                echo "prune incompatible $p"; rm -f "$p"; PRUNED=$((PRUNED+1))
              fi
            done
          done
          rm -rf "$PROBE" /tmp/kprobe.tar.xz
          echo "--- 剔除 ${PRUNED} 个补丁, 保留内核补丁数 ---"
          find target/linux -type f -name '*.patch' | wc -l

      - name: Install toolchain (prerequisite for package/compile)
        run: |
          cd openwrt
          # 不加 V=s：toolchain 全量命令行会把日志撑到几十 MB。
          make toolchain/install -j"$(nproc)" || make toolchain/install -j1 V=s

      - name: Prepare kernel build tree (kmod prerequisite)
        run: |
          cd openwrt
          # kmod 编译需要 $(LINUX_DIR)/.config 与 Module.symvers。
          # toolchain/install 只装交叉工具链，不碰内核树；缺这步会报
          # "No rule to make target .../linux-6.12.x/.config"。
          make target/linux/compile -j"$(nproc)" || make target/linux/compile -j1 V=s

      - name: Compile only the ipk
        id: compile
        run: |
          cd openwrt
          make "${{ github.event.inputs.package }}/compile" -j1 V=s

      - name: Collect ipk + ko
        if: always()
        run: |
          echo "compile outcome = ${{ steps.compile.outcome }}"
          mkdir -p out
          # 25.12 上游用 apk 打包，设备是 opkg；两种格式都收，另外把裸 ko 也收进 artifact，
          # 这样即使包格式不匹配也能直接把 ko 推到 /lib/modules/<uname -r>/。
          find openwrt/bin -type f \( -iname '*aic8800*.ipk' -o -iname '*aic8800*.apk' \) -exec cp -v {} out/ \; || true
          find openwrt/build_dir -type f -iname 'aic8800*.ko' -exec cp -v {} out/ \; || true
          echo "--- ko vermagic ---"
          for f in out/*.ko; do
            [ -f "$f" ] || continue
            printf '%s: ' "$(basename "$f")"
            strings "$f" | grep -m1 '^vermagic=' || echo '(none)'
          done
          echo "--- 产物 ---"
          ls -lh out/

      - name: Upload ipk
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aic8800-ipk
          path: out/
          # 编译失败时不让上传步再制造第二个失败，run 结果只反映真实编译结果。
          if-no-files-found: warn
