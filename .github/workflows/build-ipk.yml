# 只从上游源码库拉取，编译单个包产出 ipk。
# 不使用 fork 自定义 feed、QModem、拨号包或设备 .config 里的应用包。
name: Build IPK (upstream only)

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'Upstream OpenWrt source repo'
        required: true
        default: 'https://github.com/immortalwrt/immortalwrt'
      repo_branch:
        description: 'Upstream source branch'
        required: true
        default: 'openwrt-25.12'
      target:
        description: 'Upstream Kwrt device config (devices/<target>/.config)'
        required: true
        default: 'rockchip_armv8'
      package:
        description: 'Package path under openwrt/ to compile'
        required: true
        default: 'package/kernel/aic8800'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout clean upstream Kwrt (docs/ web site untouched)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -hT

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev libelf-dev python3 python3-dev \
            python3-distutils python3-setuptools rsync unzip zlib1g-dev file wget \
            libtool libtool-bin cmake swig ecj fastjar java-propose-classpath zstd xz-utils

      - name: Pull upstream source repo only
        run: |
          git clone --depth 1 -b "${{ github.event.inputs.repo_branch }}" "${{ github.event.inputs.repo_url }}" openwrt
          cd openwrt
          git log -1 --oneline
          test -d "${{ github.event.inputs.package }}" || { echo "上游源码缺少 ${{ github.event.inputs.package }}"; exit 1; }

      - name: Minimal config (upstream target config + target package only)
        run: |
          cd openwrt
          # 上游 devices/<target>/.config 只有 target 定义，不含任何 QModem/应用包。
          cp "../devices/${{ github.event.inputs.target }}/.config" .config
          # =m 只生成 ipk，不进固件 rootfs，避免拉起整条安装链。
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_kmod-aic8800-sdio=m
          CONFIG_PACKAGE_aic8800-sdio-firmware=m
          CONFIG_PACKAGE_kmod-cfg80211=m
          CONFIG_PACKAGE_kmod-mac80211=m
          EOF
          make defconfig
          echo "--- defconfig 后 =y 包数 ---"
          grep -c '^CONFIG_PACKAGE_.*=y' .config || true

      - name: Install toolchain (prerequisite for package/compile)
        run: |
          cd openwrt
          make toolchain/install -j"$(nproc)" V=s

      - name: Compile only the ipk
        id: compile
        continue-on-error: true
        run: |
          cd openwrt
          make "${{ github.event.inputs.package }}/compile" -j"$(nproc)" V=s

      - name: Collect ipk
        run: |
          mkdir -p out
          find openwrt/bin -type f \( -name '*aic8800*.ipk' -o -name '*aic8800*.apk' \) -exec cp -v {} out/ \;
          echo "--- 产物 ---"
          ls -lh out/

      - name: Upload ipk
        uses: actions/upload-artifact@v4
        with:
          name: aic8800-ipk
          path: out/
          if-no-files-found: error
